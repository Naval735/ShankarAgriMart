<nav class="main-navbar">

  <!-- ================================
       TOP NAVIGATION
  ================================= -->

  <div class="navbar-top">

    <div class="container-fluid navbar-container">

      <!-- Brand -->
      <a
        routerLink="/home"
        class="brand"
        (click)="closeMenu()"
      >

        <span class="brand-icon">
          🌱
        </span>

        <span class="brand-name">
          ShankarAgriMart
        </span>

      </a>


      <!-- Search -->
      <div class="navbar-search">

        <input
          type="text"
          class="search-input"
          placeholder="Search products, pesticides, fertilizers..."
        />

        <button
          type="button"
          class="search-button"
          aria-label="Search"
        >
          <i class="bi bi-search"></i>
        </button>

      </div>


      <!-- Language -->
      <button
        type="button"
        class="language-button"
      >
        English
      </button>


      <!-- Mobile toggle -->
      <button
        type="button"
        class="mobile-toggle"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isMenuOpen"
        (click)="toggleMenu()"
      >

        @if (!isMenuOpen) {
          <i class="bi bi-list"></i>
        } @else {
          <i class="bi bi-x-lg"></i>
        }

      </button>

    </div>

  </div>


  <!-- ================================
       NAVIGATION
  ================================= -->

  <div
    class="navbar-navigation"
    [class.mobile-open]="isMenuOpen"
  >

    <div class="container-fluid navbar-container">

      <div class="navigation-links">

        <!-- Home -->
        <a
          routerLink="/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Home
        </a>


        <!-- Products -->
        <a
          routerLink="/products"
          routerLinkActive="active"
          class="navigation-link"
          (click)="closeMenu()"
        >
          All Products
        </a>


        <!-- Categories -->
        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 1 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Seeds
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 2 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Fertilizers
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 3 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Pesticides
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 4 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Crop Protection
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 5 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Plant Nutrition
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 6 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Farm Accessories
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 7 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Gardening
        </a>


        <!-- ================================
             AUTHENTICATED USER
        ================================= -->

       @if (isAuthenticated) {

  <div class="navigation-divider"></div>


  <!-- ================================
       CUSTOMER ONLY
  ================================= -->

  @if (!isAdmin) {

    <a
      routerLink="/orders"
      routerLinkActive="active"
      class="navigation-link account-link"
      (click)="closeMenu()"
    >
      <i class="bi bi-box-seam me-1"></i>
      My Orders
    </a>


    <a
      routerLink="/cart"
      routerLinkActive="active"
      class="navigation-link account-link"
      (click)="closeMenu()"
    >
      <i class="bi bi-cart3 me-1"></i>
      Cart
    </a>

  }


  <!-- ================================
       ADMIN ONLY
  ================================= -->

  @if (isAdmin) {

    <a
      routerLink="/admin/dashboard"
      routerLinkActive="active"
      class="admin-panel-link"
      (click)="closeMenu()"
    >
      <i class="bi bi-speedometer2 me-1"></i>
      Admin Panel
    </a>

  }


  <!-- Logout -->
  <button
    type="button"
    class="logout-link"
    [disabled]="isLoggingOut"
    (click)="logout()"
  >

    @if (isLoggingOut) {

      <span
        class="spinner-border spinner-border-sm me-1"
      ></span>

      Logging out...

    } @else {

      <i class="bi bi-box-arrow-right me-1"></i>
      Logout

    }

  </button>

}


        <!-- ================================
             GUEST
        ================================= -->

        @if (
          isAuthChecked &&
          !isAuthenticated
        ) {

          <a
            routerLink="/login"
            routerLinkActive="active"
            class="login-link"
            (click)="closeMenu()"
          >
            <i class="bi bi-person me-1"></i>
            Login
          </a>

        }

      </div>

    </div>

  </div>

</nav>
