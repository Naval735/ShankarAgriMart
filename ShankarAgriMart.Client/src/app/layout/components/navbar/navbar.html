
<nav class="main-navbar">

  <div class="navbar-top">
    <div class="container-fluid navbar-container">

      <a
        routerLink="/home"
        class="brand"
        (click)="closeMenu()"
        aria-label="ShankarAgriMart Home"
      >
        <img
          src="/images/image.png"
          alt="ShankarAgriMart"
          class="brand-logo"
        />
      </a>

      <div class="navbar-search">
        <input
          type="text"
          class="search-input"
          placeholder="Search products, pesticides, fertilizers..."
          aria-label="Search products"
        />

        <button
          type="button"
          class="search-button"
          aria-label="Search"
        >
          <i class="bi bi-search"></i>
        </button>
      </div>

      <button
        type="button"
        class="language-button"
      >
        English
      </button>

      <button
        type="button"
        class="mobile-search-button"
        aria-label="Search products"
        [attr.aria-expanded]="isMobileSearchOpen"
        (click)="toggleMobileSearch()"
      >
        @if (!isMobileSearchOpen) {
          <i class="bi bi-search"></i>
        } @else {
          <i class="bi bi-x-lg"></i>
        }
      </button>

      @if (isAuthenticated) {
        <div class="profile-menu">
          <button
            type="button"
            class="profile-button"
            aria-label="Open profile menu"
            aria-haspopup="true"
            [attr.aria-expanded]="isProfileMenuOpen"
            (click)="toggleProfileMenu()"
          >
            <i class="bi bi-person-circle"></i>
          </button>

          @if (isProfileMenuOpen) {
            <div class="profile-dropdown">

              @if (isAdmin) {
                <a
                  routerLink="/admin/dashboard"
                  routerLinkActive="active"
                  class="profile-dropdown-link"
                  (click)="closeProfileMenu(); closeMenu()"
                >
                  <i class="bi bi-speedometer2"></i>
                  <span>Admin Dashboard</span>
                </a>
              } @else {
                <a
                  routerLink="/cart"
                  routerLinkActive="active"
                  class="profile-dropdown-link"
                  (click)="closeProfileMenu(); closeMenu()"
                >
                  <i class="bi bi-cart3"></i>
                  <span>My Cart</span>
                </a>

                <a
                  routerLink="/orders"
                  routerLinkActive="active"
                  class="profile-dropdown-link"
                  (click)="closeProfileMenu(); closeMenu()"
                >
                  <i class="bi bi-box-seam"></i>
                  <span>My Orders</span>
                </a>
              }

              <div class="profile-dropdown-divider"></div>

              <button
                type="button"
                class="profile-dropdown-link logout-link"
                [disabled]="isLoggingOut"
                (click)="logout()"
              >
                @if (isLoggingOut) {
                  <span
                    class="spinner-border spinner-border-sm"
                    aria-hidden="true"
                  ></span>
                  <span>Logging out...</span>
                } @else {
                  <i class="bi bi-box-arrow-right"></i>
                  <span>Logout</span>
                }
              </button>

            </div>
          }
        </div>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive="active"
          class="login-link"
          (click)="closeMenu()"
        >
          <i class="bi bi-person me-1"></i>
          Login
        </a>
      }

      <button
        type="button"
        class="mobile-toggle"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isMenuOpen"
        (click)="toggleMenu()"
      >
        @if (!isMenuOpen) {
          <i class="bi bi-list"></i>
        } @else {
          <i class="bi bi-x-lg"></i>
        }
      </button>

    </div>
  </div>

  @if (isMobileSearchOpen) {
    <div class="mobile-search-container">
      <div class="mobile-search-wrapper">
        <i class="bi bi-search mobile-search-icon"></i>

        <input
          type="text"
          class="mobile-search-input"
          placeholder="Search products..."
          aria-label="Search products"
          autofocus
        />
      </div>
    </div>
  }

  <div
    class="navbar-navigation"
    [class.mobile-open]="isMenuOpen"
  >
    <div class="container-fluid navbar-container">

      <div class="navigation-links">

        <a
          routerLink="/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Home
        </a>

        <a
          routerLink="/services"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Services
        </a>

        <a
          routerLink="/about"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          About
        </a>

        <a
          routerLink="/products"
          routerLinkActive="active"
          class="navigation-link"
          (click)="closeMenu()"
        >
          All Products
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 1 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Seeds
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 2 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Fertilizers
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 3 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Pesticides
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 4 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Crop Protection
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 5 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Plant Nutrition
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 6 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Farm Accessories
        </a>

        <a
          routerLink="/products"
          [queryParams]="{ categoryId: 7 }"
          class="navigation-link"
          (click)="closeMenu()"
        >
          Gardening
        </a>

      </div>

    </div>
  </div>

</nav>
